plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// Load the dependency versions for the Minecraft version being built (see versions/*.properties).
def mcProps = new Properties()
file("versions/${project.mc}.properties").withInputStream { mcProps.load(it) }
mcProps.each { key, value -> project.ext.set(key, value) }

// e.g. hardcore-expeditions-1.0.0+mc26.3.jar, so jars for different versions don't overwrite each other.
version = "${project.version}+mc${project.minecraft_version}"

repositories {
	// Fantasy (runtime world creation) is hosted on the Nucleoid maven.
	maven { url = 'https://maven.nucleoid.xyz/' }
	// Mod Menu, only needed to compile the optional config-button integration.
	maven { url = 'https://maven.terraformersmc.com/releases/' }
}

// Version-specific code (see src/versions/<mc>/) is compiled alongside the shared code.
sourceSets.main.java.srcDir "src/versions/${project.mc}/java"

loom {
	splitEnvironmentSourceSets()

	// Separate test-server/client folder per Minecraft version (run/26.2, run/26.3).
	runs.configureEach {
		runDir = "run/${project.mc}"
	}

	mods {
		"hardcore_expeditions" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Fantasy creates and deletes the per-expedition worlds while the server is running.
	// "include" bundles it inside our jar so players/servers only need to install one file.
	implementation "xyz.nucleoid:fantasy:${project.fantasy_version}"
	include "xyz.nucleoid:fantasy:${project.fantasy_version}"

	// Optional: if Mod Menu is installed, its config button opens our HUD layout editor.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	def minecraftVersion = project.minecraft_version
	inputs.property "version", version
	inputs.property "minecraftVersion", minecraftVersion

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_version": minecraftVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
